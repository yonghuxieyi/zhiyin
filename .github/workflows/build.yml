# 智音 CI: build the app unsigned and run the offline unit tests.
#
# Notes:
# - The runner must carry Xcode 26 (the project targets the iOS 26
#   SDK). `macos-26` ships Xcode 26.
# - macOS runner minutes bill at 10x the Linux rate, so this workflow
#   stays minimal: one build, one offline test run, one IPA artifact.
# - The macos-26 runner's Xcode 26 ships without the iOS device
#   platform, so a generic-device build fails with
#   "iOS 26.0 is not installed". Download it first
#   (`xcodebuild -downloadPlatform iOS`) before building.
# - Live/network tests are skipped: PinyinLiveTests needs a DeepSeek key,
#   and the UI tests need one too (see ZHIYIN_TEST_API_KEY /
#   /tmp/zhiyin-deepseek.key in those tests).
# - The IPA is built for a generic iOS device (not the simulator), so the
#   unsigned .app inside is installable on a real phone via SideStore.
#   It is unsigned on purpose: signing happens on the phone with the
#   owner's own Apple ID.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 省额度：同一分支连续推几次只跑最后一次，前面没跑完的自动
# 取消。macOS runner 按 Linux 10 倍计费，被新提交取代的构建
# 纯属烧钱。组名按分支来，不同分支互不干扰。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE26" ]; then
            sudo xcode-select -s "$XCODE26/Contents/Developer"
          fi
          xcodebuild -version

      - name: Download iOS platform
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          xcodebuild build \
            -scheme Zhiyin \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests (offline only, simulator)
        run: |
          xcodebuild test \
            -scheme Zhiyin \
            -derivedDataPath build/DerivedData \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skip-testing:RunseTests/PinyinLiveTests \
            -skip-testing:RunseUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          # Product name comes from PRODUCT_NAME (Zhiyin), but find the
          # .app instead of hardcoding it so a rename never breaks this.
          APP_PATH=$(find build/DerivedData/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found under build/DerivedData/Build/Products/Debug-iphoneos" >&2
            find build/DerivedData -name "*.app" -type d | head
            exit 1
          fi
          rm -rf build/Payload build/Zhiyin-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Zhiyin.app
          (cd build && zip -qr Zhiyin-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zhiyin-unsigned
          path: build/Zhiyin-unsigned.ipa
          retention-days: 14
